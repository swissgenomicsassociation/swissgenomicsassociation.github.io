- title: Zoom meeting
  topic: Review the consensus evidence model in the SGA guideline (<a href="https://www.swissgenomicsassociation.ch/assets/release/mendelian_disease_interpretation/latest/mendelian_disease_interpretation_v1.pdf">link</a>). The aim is to agree a shared minimum evidence rule set that all service providers can satisfy. Using reverse reasoning and a common set of flags, any pipeline or platform can demonstrate that its outputs meet the national evidence format. This creates a uniform baseline across clinical, research, and commercial genomics and reduces the fragmentation that limits trust and interoperability.
  datetime: "2026-01-05 17:00"
  link: "mailto:admin@switzerlandomics.ch"

